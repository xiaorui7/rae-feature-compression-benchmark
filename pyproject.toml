[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rae-feature-compression-benchmark"
version = "0.1.0"
description = "Reproducible compression and retrieval benchmarks for pooled RAE features"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "threadpoolctl>=3.4,<4",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
real = [
  "omegaconf>=2.3,<3",
  "torchvision>=0.17",
  "transformers>=4.46,<5",
]

[project.scripts]
featurebench = "featurebench.__main__:main"

[tool.setuptools]
packages = ["featurebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

